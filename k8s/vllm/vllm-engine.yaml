# vLLM engine — google/gemma-4-E2B (safetensors) on nidubuntu
#
# Runs ALONGSIDE the Ollama deployment ("vllm", NodePort 30900, gemma4:26b).
# GPU sharing: this pod claims NO nvidia.com/gpu resource — it sees the A40
# via NVIDIA_VISIBLE_DEVICES=all (nvidia is containerd's default runtime on
# nidubuntu, verified 2026-09-05). K8s can't split one GPU between two pods;
# this sidesteps the scheduler while VRAM is partitioned by config:
#   vLLM E2B:  gpu-memory-utilization 0.30  (~14 GB: 10 weights + 4 KV)
#   Ollama 27B: loads on demand (~20 GB), evicts after 5 min idle
#
# Model: /var/lib/vllm-models/blobs/gemma-4-E2B (HF safetensors, ~9.6 GB,
# downloaded from huggingface.co/google/gemma-4-E2B — Apache 2.0, ungated).
#
# History: the original 27B GGUF cannot be served by vLLM (GGUF support
# removed in 0.28) nor by any published llama.cpp image (none know the
# gemma4 arch — Ollama bundles a private build). See DECISIONS.md.
#
# Apply:  kubectl apply -f vllm-engine.yaml
# Logs:   kubectl logs -n ai-services deployment/vllm-engine -f
# Test:   curl http://172.16.200.123:30901/v1/models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-engine
  namespace: ai-services
  labels:
    app: vllm-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-engine
  template:
    metadata:
      labels:
        app: vllm-engine
    spec:
      nodeSelector:
        kubernetes.io/hostname: nidubuntu
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm-engine
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent
          args:
            - --model=/models/gemma-4-E2B
            - --served-model-name=gemma-4-e2b
            - --host=0.0.0.0
            - --port=8000
            - --gpu-memory-utilization=0.30
            - --max-model-len=16384
            - --max-num-seqs=16
            - --enforce-eager
          env:
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            # GPU via default nvidia runtime — intentionally NO nvidia.com/gpu
            # resource request, so Ollama can hold the schedulable GPU.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: "16Gi"
              cpu: "4"
            limits:
              memory: "40Gi"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 90
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: models
          hostPath:
            path: /var/lib/vllm-models/blobs
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-engine
  namespace: ai-services
  labels:
    app: vllm-engine
spec:
  selector:
    app: vllm-engine
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30901
      protocol: TCP
  type: NodePort
