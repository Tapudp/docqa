# vLLM engine — Qwen3.5-27B-AWQ on nidubuntu
#
# Runs ALONGSIDE the Ollama deployment ("vllm", NodePort 30900, gemma4:26b).
#
# Weights live on nidubuntu's disk at /var/lib/vllm-models/blobs/ — the root
# LV was extended 100G -> 600G on 2026-09-05 (the old 98GB root caused the
# DiskPressure eviction loops; 17.4TB still unallocated in the VG for future
# growth: sudo lvextend -L +NG /dev/ubuntu-vg/ubuntu-lv && sudo resize2fs ...).
#
# Model: QuantTrio/Qwen3.5-27B-AWQ (Apache 2.0, ungated, AWQ 4-bit, 21GB).
# Arch Qwen3_5ForConditionalGeneration — verified in vLLM 0.28 registry.
# Source copy kept at nid-practice:/home/nidp/models/Qwen3.5-27B-AWQ.
#
# Apply:  kubectl apply -f vllm-engine.yaml
# Logs:   kubectl logs -n ai-services deployment/vllm-engine -f
# Test:   curl http://172.16.200.123:30901/v1/models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-engine
  namespace: ai-services
  labels:
    app: vllm-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-engine
  template:
    metadata:
      labels:
        app: vllm-engine
    spec:
      nodeSelector:
        kubernetes.io/hostname: nidubuntu
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm-engine
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent
          args:
            - --model=/models/Qwen3.5-27B-AWQ
            - --served-model-name=qwen3.5-27b
            - --host=0.0.0.0
            - --port=8000
            - --gpu-memory-utilization=0.45
            - --max-model-len=16384
            - --max-num-seqs=16
            - --enforce-eager
          env:
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            # GPU via default nvidia runtime — intentionally NO nvidia.com/gpu
            # resource request, so Ollama can hold the schedulable GPU.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: "24Gi"
              cpu: "4"
            limits:
              memory: "64Gi"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 90
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: models
          hostPath:
            path: /var/lib/vllm-models/blobs
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-engine
  namespace: ai-services
  labels:
    app: vllm-engine
spec:
  selector:
    app: vllm-engine
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30901
      protocol: TCP
  type: NodePort
