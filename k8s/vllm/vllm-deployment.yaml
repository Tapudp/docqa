# Ollama — OpenAI-compatible LLM serving for the NID enterprise cluster
#
# Runs on nidubuntu (172.16.200.123) — A40 48GB with working GPU driver.
# Model: Gemma 4 27B Q4_K_M GGUF at /var/lib/vllm-models/blobs/ on nidubuntu.
#
# Deployment sequence on first start:
#   1. Container starts; ollama serve listens on :8000 in background
#   2. Startup script runs "ollama create gemma4:26b" from the GGUF (~2 min to hash 17GB)
#   3. Model is available; pod becomes Ready
#   On subsequent restarts the blob is already in /var/lib/ollama → instant startup.
#
# Apply:  kubectl apply -f vllm-deployment.yaml
# Scale:  kubectl scale deployment/vllm -n ai-services --replicas=1
# Delete: kubectl delete -f vllm-deployment.yaml
#
# Internal endpoint:  http://vllm.ai-services.svc.cluster.local:8000/v1
# External NodePort:  http://<any-node-ip>:30900/v1

---
# ── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-services
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      nodeSelector:
        kubernetes.io/hostname: nidubuntu

      terminationGracePeriodSeconds: 60

      containers:
        - name: vllm
          image: ollama/ollama:latest
          imagePullPolicy: Always

          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "=== Starting Ollama on :8000 ==="
              ollama serve &
              OLLAMA_PID=$!

              echo "=== Waiting for Ollama to be ready (ollama list) ==="
              until OLLAMA_HOST=http://localhost:8000 ollama list > /dev/null 2>&1; do
                sleep 2
              done

              echo "=== Creating model from GGUF (hashing 17GB — may take ~5 min) ==="
              printf 'FROM /models/gemma4-26b-q4km.gguf\n' > /tmp/Modelfile
              OLLAMA_HOST=http://localhost:8000 ollama create gemma4:26b -f /tmp/Modelfile

              echo "=== Model ready. Ollama serving gemma4:26b ==="
              wait $OLLAMA_PID

          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:8000"
            - name: OLLAMA_MODELS
              value: /var/lib/ollama
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"

          ports:
            - containerPort: 8000
              name: http

          resources:
            requests:
              nvidia.com/gpu: "1"
              memory: "16Gi"
              cpu: "4"
            limits:
              nvidia.com/gpu: "1"
              memory: "48Gi"

          volumeMounts:
            - name: ollama-blobs
              mountPath: /models
            - name: ollama-models
              mountPath: /var/lib/ollama
            - name: shm
              mountPath: /dev/shm

          # Model creation takes ~2 min; allow up to 5 min before failing startup
          startupProbe:
            httpGet:
              path: /api/tags
              port: 8000
            failureThreshold: 60
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/tags
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/tags
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: ollama-blobs
          hostPath:
            path: /var/lib/vllm-models/blobs
            type: DirectoryOrCreate

        - name: ollama-models
          hostPath:
            path: /var/lib/ollama
            type: DirectoryOrCreate

        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"

---
# ── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: ai-services
  labels:
    app: vllm
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30900
      protocol: TCP
  type: NodePort
